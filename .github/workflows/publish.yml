name: Publish reviewed PHP SDK

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-publish-php
  cancel-in-progress: false

jobs:
  detect-release:
    name: Detect and validate release candidate
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enforce publish-workflow credential isolation
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/publish.yml
          if grep -Eq '\$\{\{[[:space:]]*secrets\.' "$WORKFLOW"; then
            echo "::error::SDK publishing must not reference registry or repository secrets."
            exit 1
          fi
          if grep -Eq '^[[:space:]]+(NPM_TOKEN|NODE_AUTH_TOKEN|PACKAGIST_TOKEN|PYPI_TOKEN):' "$WORKFLOW"; then
            echo "::error::SDK publishing must not declare registry credential variables."
            exit 1
          fi
          if grep -Eq '^[[:space:]]+workflow_dispatch:' "$WORKFLOW"; then
            echo "::error::Out-of-band workflow_dispatch publishing is forbidden."
            exit 1
          fi

      - name: Parse release marker
        id: release
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [[ "$PR_HEAD_REF" != sdk-release/v* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECT=$(git log -1 --format=%s)
          if [[ ! "$SUBJECT" =~ ^sdk\[release\]:\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::error::SDK candidate commits must use the exact sdk[release]: <semver> subject."
              exit 1
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$SUBJECT" != "$PR_TITLE" ]; then
              echo "::error::SDK candidate PR title must equal its commit subject."
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "sdk-release/v${VERSION}" ]; then
              echo "::error::SDK candidate branch must be sdk-release/v${VERSION}."
              exit 1
            fi
          fi

          test -f .revkeen-release.json
          SDK_VERSION="$VERSION" EXPECTED_LANGUAGE=php node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync(".revkeen-release.json", "utf8"));
          if (manifest.schemaVersion !== 1) throw new Error("Unsupported .revkeen-release.json schema");
          if (manifest.language !== process.env.EXPECTED_LANGUAGE) throw new Error("Release manifest language mismatch");
          if (manifest.version !== process.env.SDK_VERSION) throw new Error("Release manifest version mismatch");
          if (manifest.source?.repository !== "RevKeen/revkeen") throw new Error("Release manifest source repository mismatch");
          if (!/^[0-9a-f]{40}$/.test(manifest.source?.sha || "")) throw new Error("Release manifest source SHA is invalid");
          if (manifest.source?.commitSubject !== `sdk[release]: ${process.env.SDK_VERSION}`) throw new Error("Release manifest source subject mismatch");
          NODE

          MANIFEST_SOURCE=$(node -p "require('./.revkeen-release.json').source.sha")
          SOURCE_SHA=$(git log -1 --format=%B | sed -n 's/^Source: //p' | tail -1)
          if [ "$SOURCE_SHA" != "$MANIFEST_SOURCE" ]; then
            echo "::error::Release commit Source trailer must match .revkeen-release.json."
            exit 1
          fi

          PACKAGE_VERSION=$(php -r '$json = json_decode(file_get_contents("composer.json"), true, flags: JSON_THROW_ON_ERROR); echo $json["version"];')
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::composer.json version $PACKAGE_VERSION does not match release marker $VERSION."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate SDK release candidate
    needs: detect-release
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: curl, json, mbstring
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate, lint, format-check, and test
        run: |
          composer validate --strict
          find src test -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          vendor/bin/php-cs-fixer check --diff --allow-risky=yes
          vendor/bin/phpunit test

  publish:
    name: Approve and publish PHP SDK tag
    needs:
      - detect-release
      - validate
    if: github.event_name == 'push' && needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: sdk-release-php
    permissions:
      contents: write
    steps:
      - name: Enforce reviewed release sentinel
        env:
          REVIEW_GATE: ${{ vars.SDK_RELEASE_REVIEW_GATE }}
        run: |
          if [ "$REVIEW_GATE" != "enabled" ]; then
            echo "::error::sdk-release-php is missing the reviewed release sentinel."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "RevKeen Bot"
          git config user.email "bot@revkeen.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "${TAG}")" = "$GITHUB_SHA"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Release summary
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          echo "## Reviewed PHP SDK release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: revkeen/sdk-php" >> "$GITHUB_STEP_SUMMARY"
          echo "- Packagist ingestion: verify the repository integration observes this tag" >> "$GITHUB_STEP_SUMMARY"
